[project]
name = "wildlife-cull"
version = "0.1.0"
description = "Local AI-assisted culling tool for wildlife photographers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
  "pillow>=10.2",
  "numpy>=1.26",
  "sentence-transformers>=2.7",
  "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wildlife_cull*"]

[tool.setuptools.package-data]
wildlife_cull = ["static/*"]
